<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Logo%20(6).png" />
    <link rel="apple-touch-icon" href="/Logo (6).png" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Primary SEO -->
    <title>Zeebac – Shop Local, Pay Your Way & Earn Cashback</title>
    <meta name="description" content="Zeebac lets you shop at verified local partner stores, pay by QR or online, buy now pay later and earn cashback points on every purchase. 1 Zeebac Point = ₹1." />
    <meta name="keywords" content="Zeebac, cashback app, local stores, scan and pay, QR payment, buy now pay later, BNPL, rewards points, grocery delivery, Lucknow" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Zeebac" />
    <meta name="application-name" content="Zeebac" />
    <link rel="canonical" href="https://zeebac.com/" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zeebac" />
    <meta property="og:title" content="Zeebac – Shop Local, Pay Your Way & Earn Cashback" />
    <meta property="og:description" content="Shop at verified Zeebac partner stores, pay by QR or online and earn cashback points on every purchase." />
    <meta property="og:url" content="https://zeebac.com/" />
    <meta property="og:image" content="https://zeebac.com/Logo%20(6).png" />
    <meta property="og:image:alt" content="Zeebac logo" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Zeebac – Shop Local, Pay Your Way & Earn Cashback" />
    <meta name="twitter:description" content="Shop at verified Zeebac partner stores, pay by QR or online and earn cashback points on every purchase." />
    <meta name="twitter:image" content="https://zeebac.com/Logo%20(6).png" />

    <!-- Structured data: brand / site identity for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://zeebac.com/#organization",
            "name": "Zeebac",
            "url": "https://zeebac.com/",
            "logo": "https://zeebac.com/Logo%20(6).png"
          },
          {
            "@type": "WebSite",
            "@id": "https://zeebac.com/#website",
            "name": "Zeebac",
            "url": "https://zeebac.com/",
            "publisher": { "@id": "https://zeebac.com/#organization" },
            "inLanguage": "en-IN"
          }
        ]
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
