name: zeebac_mobile_wrapper
description: "Native Flutter wrapper for ZeeBac Customer and Vendor apps with biometrics and secure storage"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  # Native device authentication (Fingerprint, Face ID, Device PIN fallback)
  local_auth: ^2.3.0
  # Hybrid WebView container bridging React & Flutter
  flutter_inappwebview: ^6.1.5
  # Hardware-backed Keystore / Keychain secure token storage
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
